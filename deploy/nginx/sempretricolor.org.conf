# Reverse proxy para a sondagem em https://sempretricolor.org/
#
# Instalação na VPS:
#   sudo cp deploy/nginx/sempretricolor.org.conf /etc/nginx/sites-available/sempretricolor.org
#   sudo ln -s /etc/nginx/sites-available/sempretricolor.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sempretricolor.org -d www.sempretricolor.org
#
# O certbot reescreve este arquivo sozinho na primeira execução (adiciona os
# caminhos do certificado e o bloco 443). Não precisa editar TLS na mão.

server {
    listen 80;
    listen [::]:80;
    server_name sempretricolor.org www.sempretricolor.org;

    location / {
        return 301 https://sempretricolor.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sempretricolor.org;

    ssl_certificate /etc/letsencrypt/live/sempretricolor.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sempretricolor.org/privkey.pem;

    return 301 https://sempretricolor.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sempretricolor.org;

    ssl_certificate /etc/letsencrypt/live/sempretricolor.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sempretricolor.org/privkey.pem;

    # Cadastro envia foto do candidato só pelo painel admin, não no fluxo
    # público — mas o painel roda no mesmo host. MAX_UPLOAD_SIZE_MB no .env
    # é 5; a margem aqui evita que o Nginx corte antes da validação da
    # aplicação rodar e devolver um erro claro.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
