# Reverse proxy para a sondagem em https://sempretricolor.org/pesquisa2026
#
# A sondagem NÃO mora mais na raiz do domínio. A raiz está reservada para o
# site institucional do Sempre Tricolor; a sondagem é provisória (fica no ar
# até o fim de novembro de 2026) e vive sob /pesquisa2026. O prefixo também
# existe do lado da aplicação, em APP_PATH_PREFIX (.env) — os dois precisam
# concordar, senão o Nginx encaminha um caminho que nenhuma rota atende.
#
# Este arquivo é o BOOTSTRAP — só HTTP, sem TLS. Testado de verdade em
# 2026-08-19: o certbot precisa que o nginx suba com uma config válida
# ANTES de rodar, porque valida o domínio fazendo a requisição HTTP-01
# passar por este mesmo proxy. Um bloco 443 escrito na mão, referenciando
# um certificado que ainda não existe, faz "nginx -t" falhar e o certbot
# nunca chega a rodar — foi tentado e não funciona.
#
# Instalação na VPS (primeira vez):
#   sudo cp deploy/nginx/sempretricolor.org.conf /etc/nginx/sites-available/sempretricolor.org
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -sf /etc/nginx/sites-available/sempretricolor.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx && sudo systemctl enable nginx
#   sudo certbot --nginx -d sempretricolor.org -d www.sempretricolor.org \
#     --non-interactive --agree-tos -m seu-email@exemplo.com
#
# ATENÇÃO ao aplicar isto num servidor que JÁ tem TLS: o certbot reescreveu
# o arquivo lá (adicionou os blocos 443, o certificado e o redirect de 80
# para 443), e esse resultado vive só em /etc/nginx/ na VPS — não neste
# repositório. Copiar este arquivo por cima apaga o TLS. Num servidor já
# configurado, edite o arquivo de lá e leve só os blocos `location` abaixo
# para dentro do server 443 existente. Ver docs/DEPLOY.md.
server {
    listen 80;
    listen [::]:80;
    server_name sempretricolor.org www.sempretricolor.org;

    # Cadastro envia foto do candidato só pelo painel admin, não no fluxo
    # público — mas o painel roda no mesmo host. MAX_UPLOAD_SIZE_MB no .env
    # é 5; a margem aqui evita que o Nginx corte antes da validação da
    # aplicação rodar e devolver um erro claro.
    client_max_body_size 10M;

    # PROVISÓRIO: enquanto o site institucional não existe, quem chega pela
    # raiz vai para a sondagem. O link já circulou como sempretricolor.org
    # entre os sócios, e sem isto essas mensagens antigas caem num 404.
    #
    # APAGUE ESTAS TRÊS LINHAS no dia em que o site institucional subir —
    # a partir daí a raiz é dele. A sondagem continua em /pesquisa2026 e
    # nada mais precisa mudar.
    location = / {
        return 302 /pesquisa2026/;
    }

    # Sem barra no fim do proxy_pass, de propósito: assim o Nginx encaminha
    # o caminho INTEIRO ("/pesquisa2026/api/survey/candidatos") para a
    # aplicação, que é onde o prefixo também existe.
    #
    # Com barra ("proxy_pass http://127.0.0.1:8000/") o Nginx cortaria o
    # prefixo antes de encaminhar, e a aplicação — que espera recebê-lo —
    # responderia 404 em tudo. É o erro clássico desta configuração.
    location /pesquisa2026 {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo o resto da raiz é do site institucional. Enquanto ele não
    # existe, 404 explícito — e não proxy para a sondagem, senão a
    # aplicação volta a atender na raiz por caminhos que ninguém revisou.
    #
    # Quando o site institucional subir, troque este bloco pelo root/
    # proxy_pass dele.
    location / {
        return 404;
    }
}
